schema_version: 1

context:
  version: 37.0.2

package:
  name: python-kubernetes
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/k/kubernetes/kubernetes-${{ version }}.tar.gz
  sha256: 6967599ef976d0bb9c663c3621e690db0e26fbab7cf5c5e3ccf7e11b790d2de9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - certifi >=14.05.14
    - python-dateutil >=3.0.0
    - pyyaml >=6.0.3
    - websocket-client >=0.32.0,!=0.40.0,!=0.41.*,!=0.42.*
    - requests
    - requests-oauthlib
    - urllib3 >=2.8.0,<3.0.0
    - durationpy >=0.11
    - aiohttp <4.0.0,>=3.14.5
    - pydantic >=2.14.2
    - typing_extensions >=4.16.0
    - certifi >=2026.7.22
    - aiohttp-retry >=2.9.1
    - oauthlib >=4.0.0
    - certifi >=2024.7.4
tests:
  - python:
      imports:
        - kubernetes
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: Kubernetes python client
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/kubernetes-client/python

extra:
  recipe-maintainers:
    - johanneskoester
    - ocefpaf
